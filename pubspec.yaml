name: break_buddy
description: A break reminder and execution app.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=2.17.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  window_manager: ^0.5.1
  shelf: ^1.4.2
  shelf_static: ^1.1.3
  path: ^1.9.1
  media_kit: ^1.2.0                     # Primary package
  media_kit_video: ^1.3.0                # For video rendering
  media_kit_libs_windows_video: ^1.0.11  # Windows package
  media_kit_libs_android_video: ^1.3.0   # Android package

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/videos/
    - assets/thumbnails/
    - assets/video_config.json

dependency_overrides:
  media_kit_video:
    git:
      url: https://github.com/alexmercerind/media_kit
      path: media_kit_video