<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/break_buddy/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="App for reminding and executing breaks in between work.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="break_buddy">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>break_buddy</title>
  <link rel="manifest" href="manifest.json">
  
  <!-- Web Notifications Helper -->
  <script>
    (function() {
      window._breakBuddy = {
        showNotification: function(title, message) {
          if ('serviceWorker' in navigator && 'Notification' in window) {
            navigator.serviceWorker.ready.then(function(registration) {
              registration.showNotification(title, {
                body: message,
                icon: 'favicon.png',
                requireInteraction: true
              });
            });
          }
        },
        
        requestNotificationPermission: function() {
          if ('Notification' in window) {
            if (Notification.permission === 'granted') {
              return true;
            }
            if (Notification.permission !== 'denied') {
              Notification.requestPermission();
            }
          }
          return false;
        }
      };
    })();
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
